# Профили поиска. Каждый профиль — отдельная роль со своими запросами и ключевыми словами.
# Балл вакансии считается в jobhunt/scoring.py; веса — в секции scoring.

defaults:
  area: 113                 # 113 — вся Россия (для удалёнки), 2 — Санкт-Петербург
  work_format: [REMOTE]     # REMOTE, ON_SITE, HYBRID (FIELD_WORK всегда отсеивается)
  experience: [noExperience, between1And3]
  min_salary: 80000         # ниже — штраф в баллах, вакансия не отбрасывается
  period_days: 14           # искать вакансии за последние N дней
  per_query: 100            # сколько вакансий брать на один запрос (макс. 100 на страницу)

# Отсев по названию вакансии (без учёта регистра, подстрока)
exclude_title:
  - senior
  - lead
  - руководител
  - начальник
  - директор
  - разработчик
  - developer
  - программист
  - тестировщик
  - аналитик
  - продаж
  - выездн
  - разъездн
  - монтажник
  - курьер

# Штраф, если в описании есть эти слова (разъезды, командировки)
penalty_words:
  - выезд на объект
  - выезды на объект
  - выезды к клиент
  - разъездн
  - командировк
  - личный автомобиль
  - личного автомобиля

profiles:
  pos:
    title: Поддержка R-keeper / кассового ПО
    queries:
      - R-keeper
      - r_keeper
      - iiko техническая поддержка
      - поддержка кассового программного обеспечения
      - техническая поддержка ресторанов
      - техническая поддержка ККТ
    keywords: [r-keeper, r_keeper, rkeeper, iiko, касс, ккт, атол, штрих, эквайринг, фискальн, офд, ресторан, общепит, horeca, pos, 1с]

  video:
    title: Поддержка видеонаблюдения
    queries:
      - техническая поддержка видеонаблюдение
      - инженер технической поддержки систем видеонаблюдения
      - специалист поддержки VMS
    keywords: [видеонаблюден, камер, регистратор, vms, trassir, macroscop, hikvision, dahua, ivideon, rtsp, poe, скуд]

  helpdesk:
    title: Helpdesk L1/L2
    queries:
      - специалист технической поддержки
      - инженер технической поддержки
      - helpdesk
      - service desk
    keywords: [helpdesk, service desk, первой линии, второй линии, l1, l2, windows, active directory, тикет, заявк, сет, принтер, удалённ, rdp, anydesk, linux]

  noc:
    title: NOC / дежурный инженер
    queries:
      - NOC инженер
      - дежурный инженер мониторинга
      - инженер мониторинга сети
    keywords: [noc, мониторинг, zabbix, grafana, дежурн, сменн, сет, linux, cisco, mikrotik, инцидент]

  office:
    title: Офис рядом с Петроградкой
    area: 2
    work_format: [ON_SITE, HYBRID]
    max_results: 2          # в итоговый список попадёт не больше 2 офисных вакансий
    queries:
      - специалист технической поддержки
      - helpdesk
      - системный администратор
    keywords: [helpdesk, техническ, поддержк, windows, сет, касс, r-keeper, iiko, видеонаблюден, linux]
    # Офисные вакансии без одной из этих станций в адресе отбрасываются
    metro:
      - Петроградская
      - Горьковская
      - Чёрная речка
      - Чкаловская
      - Спортивная
      - Невский проспект
      - Гостиный двор
      - Сенная площадь
      - Садовая
      - Спасская
      - Технологический институт
      - Фрунзенская
      - Московские ворота
      - Электросила
      - Парк Победы
      - Московская
      - Пионерская

scoring:
  title_keyword: 3          # за каждое ключевое слово в названии
  text_keyword: 1           # за каждое ключевое слово в описании/сниппете
  text_keyword_cap: 8       # максимум баллов за описание
  penalty_word: -5          # за каждое слово про разъезды
  salary_ok: 2              # зарплата не ниже min_salary
  salary_low: -3            # зарплата указана и ниже min_salary
  has_test: -1              # есть тестовое задание
  fresh_days: 3             # свежая вакансия: опубликована не позже N дней назад
  fresh: 1
